apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-scoring-worker
  namespace: fraud-platform
  labels:
    app.kubernetes.io/name: fraud-scoring-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-scoring-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-scoring-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9101"
    spec:
      serviceAccountName: fraud-platform
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: fraud-platform-worker:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "fraud_platform.streaming.worker"]
          ports:
            - name: metrics
              containerPort: 9101
          envFrom:
            - configMapRef:
                name: fraud-platform-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-platform-secrets
                  key: DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: fraud-platform-config
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: CASSANDRA_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: fraud-platform-config
                  key: CASSANDRA_HOSTS
            - name: CASSANDRA_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
