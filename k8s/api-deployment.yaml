apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: fraud-platform
  labels:
    app.kubernetes.io/name: fraud-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: fraud-platform
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: fraud-platform-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fraud-platform-config
          env:
            - name: FRAUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fraud-platform-secrets
                  key: FRAUD_API_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fraud-platform-secrets
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
