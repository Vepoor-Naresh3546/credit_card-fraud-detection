services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env and configure it}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fraud_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fraud_platform}
      FRAUD_API_KEY: ${FRAUD_API_KEY:?Set FRAUD_API_KEY in .env}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-}
      MAX_BATCH_SIZE: ${MAX_BATCH_SIZE:-100}
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
      MAX_REQUESTS_PER_MINUTE: ${MAX_REQUESTS_PER_MINUTE:-120}
      PORT: "8000"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  bentoml:
    build:
      context: .
      dockerfile: Dockerfile.bentoml
    profiles: ["bentoml"]
    environment:
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-}
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped

  mlflow:
    build: .
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////app/mlflow/mlflow.db", "--default-artifact-root", "/app/mlflow/artifacts"]
    volumes:
      - mlflow_data:/app/mlflow
    ports:
      - "127.0.0.1:5000:5000"
    profiles: ["mlflow"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  broker:
    image: bitnami/kafka:3.7.0
    profiles: ["streaming"]
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@broker:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://broker:9092,EXTERNAL://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set a Kafka cluster ID in .env}
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data:/bitnami/kafka
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: bitnami/kafka:3.7.0
    profiles: ["streaming"]
    environment:
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-transactions.raw}
      KAFKA_SCORED_TOPIC: ${KAFKA_SCORED_TOPIC:-transactions.scored}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-fraud.alerts}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-transactions.dlq}
    depends_on:
      broker:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for topic in "$$KAFKA_RAW_TOPIC" "$$KAFKA_SCORED_TOPIC" "$$KAFKA_ALERTS_TOPIC" "$$KAFKA_DLQ_TOPIC"; do
          /opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server broker:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  cassandra:
    image: cassandra:5.0.4
    profiles: ["streaming"]
    environment:
      CASSANDRA_CLUSTER_NAME: fraud-platform-local
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE CLUSTER'"]
      interval: 20s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  cassandra-schema:
    image: cassandra:5.0.4
    profiles: ["streaming"]
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    entrypoint: ["/bin/bash", "-ec"]
    command: ["cqlsh cassandra 9042 -f /schema.cql"]

  worker:
    build:
      context: .
      args:
        INSTALL_STREAMING: "true"
    profiles: ["streaming"]
    command: ["python", "-m", "fraud_platform.streaming.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fraud_platform}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD:-}
      KAFKA_BOOTSTRAP_SERVERS: broker:9092
      KAFKA_RAW_TOPIC: ${KAFKA_RAW_TOPIC:-transactions.raw}
      KAFKA_SCORED_TOPIC: ${KAFKA_SCORED_TOPIC:-transactions.scored}
      KAFKA_ALERTS_TOPIC: ${KAFKA_ALERTS_TOPIC:-fraud.alerts}
      KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-transactions.dlq}
      KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:-fraud-scoring-v1}
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_ENABLED: "true"
      MAX_BATCH_SIZE: "50"
      MAX_REQUEST_BYTES: ${MAX_REQUEST_BYTES:-1048576}
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      cassandra-schema:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["streaming"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: broker:9092
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      broker:
        condition: service_healthy
    restart: unless-stopped

  spark:
    build:
      context: .
      dockerfile: Dockerfile.spark
    profiles: ["spark"]
    volumes:
      - ./data:/opt/fraud-platform/data
      - ./reports:/opt/fraud-platform/reports
    command:
      - python3
      - -m
      - fraud_platform.spark_jobs
      - validate
      - --input
      - /opt/fraud-platform/data/creditcard.csv
      - --output
      - /opt/fraud-platform/data/processed/creditcard

  airflow-db:
    image: postgres:16.4
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Set AIRFLOW_DB_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    environment: &airflow_environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:?Set AIRFLOW_SECRET_KEY in .env}
      PYTHONPATH: /opt/fraud-platform
      GX_ANALYTICS_ENABLED: "false"
      MLFLOW_TRACKING_URI: sqlite:////opt/fraud-platform/mlflow.db
      MIN_MODEL_F1: ${MIN_MODEL_F1:-0.65}
      MIN_MODEL_RECALL: ${MIN_MODEL_RECALL:-0.70}
      MIN_MODEL_PRECISION: ${MIN_MODEL_PRECISION:-0.60}
    volumes:
      - .:/opt/fraud-platform
      - airflow_logs:/opt/airflow/logs
    command: ["airflow", "db", "migrate"]
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    environment:
      <<: *airflow_environment
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      _AIRFLOW_WWW_USER_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.invalid}
    volumes:
      - .:/opt/fraud-platform
      - airflow_logs:/opt/airflow/logs
    command: ["airflow", "webserver"]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    profiles: ["airflow"]
    environment: *airflow_environment
    volumes:
      - .:/opt/fraud-platform
      - airflow_logs:/opt/airflow/logs
    command: ["airflow", "scheduler"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  mlflow_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  cassandra_data:
  airflow_db_data:
  airflow_logs:
