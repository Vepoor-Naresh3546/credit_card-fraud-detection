databases:
  - name: fraud-platform-db
    databaseName: fraud_platform
    user: fraud_platform
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: fraud-platform-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fraud-platform-db
          property: connectionString
      - key: FRAUD_API_KEY
        generateValue: true
      - key: MAX_REQUESTS_PER_MINUTE
        value: "120"
      - key: MAX_BATCH_SIZE
        value: "100"
